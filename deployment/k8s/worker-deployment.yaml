apiVersion: apps/v1
kind: Deployment
metadata:
  name: arguslens-worker
  namespace: arguslens
  labels:
    app: arguslens-worker
    tier: compute
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arguslens-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: arguslens-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: arguslens/worker:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "tasks.celery_app", "worker", "--loglevel=info", "-c", "4"]
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: arguslens-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: arguslens-secrets
                  key: database-url
            - name: AUTONOMY_LEVEL
              value: "autonomous"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8000m"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          livenessProbe:
            exec:
              command: ["celery", "-A", "tasks.celery_app", "inspect", "ping", "-d", "all"]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
