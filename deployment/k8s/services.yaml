apiVersion: v1
kind: Service
metadata:
  name: arguslens-api
  namespace: arguslens
  labels:
    app: arguslens-api
spec:
  selector:
    app: arguslens-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: arguslens-api-lb
  namespace: arguslens
  labels:
    app: arguslens-api
spec:
  selector:
    app: arguslens-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
    - name: websocket
      protocol: TCP
      port: 8001
      targetPort: 8000
  type: LoadBalancer
